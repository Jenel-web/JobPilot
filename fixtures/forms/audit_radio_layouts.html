<!doctype html>
<!-- Audit regression (Bug 1): radio/checkbox questions WITHOUT a <legend>. Synthetic, no real data. -->
<html><head><meta charset="utf-8"><title>Audit: radio layouts</title></head>
<body>
<form id="app" onsubmit="event.preventDefault()">

  <!-- Layout 1, Lever: question in a div, choices in a ul -->
  <div class="application-question"><div class="application-label">Are you eligible to work? <span>✱</span></div>
  <ul><li><label><input type="radio" name="cards[1]" value="Yes"> Yes</label></li>
      <li><label><input type="radio" name="cards[1]" value="No"> No</label></li></ul></div>

  <!-- Layout 2, Google-Form style: the question is a <label> beside the choices -->
  <div><label>Do you have your own laptop? *</label>
  <label><input type="radio" name="entry.14" value="Yes"> Yes</label>
  <label><input type="radio" name="entry.14" value="No"> No</label></div>

  <!-- Layout 3, Greenhouse without its legend: question in a <p>, each choice in its own <div> -->
  <div class="field"><p>Are you willing to work onsite?</p>
  <div><label><input type="radio" name="question_3" value="Yes"> Yes</label></div>
  <div><label><input type="radio" name="question_3" value="No"> No</label></div></div>

  <!-- A real <fieldset><legend> must still win over any nearby text -->
  <fieldset><legend>Preferred work setup</legend>
  <p>Pick the one you like best</p>
  <label><input type="radio" name="setup" value="Onsite"> Onsite</label>
  <label><input type="radio" name="setup" value="Remote"> Remote</label></fieldset>

  <!-- Trap: a section heading, then another field, then a radio group with no question of its own.
       The reader must NOT take "Education" as the question (it stops at the School block). -->
  <div class="section"><h3>Education</h3>
  <div><label for="school">School</label><input id="school" name="school"></div>
  <div><label><input type="radio" name="yl" value="1st year"> 1st year</label>
       <label><input type="radio" name="yl" value="2nd year"> 2nd year</label></div></div>

  <!-- A lone checkbox is its own question -->
  <div><label><input type="checkbox" name="consent"> I consent to the processing of my personal data</label></div>

  <button type="submit">Submit application</button>
</form>
</body></html>
